network:
  bonds:
    bond0:
      interfaces:
      - enp1s0
      - enp2s0
      parameters:
        lacp-rate: fast
        mode: 802.3ad
        transmit-hash-policy: layer2
  ethernets:
    enp1s0: {}
    enp2s0: {}
  version: 2
  vlans:
    bond0.@VLAN@:
      addresses:
      - @ADDRESS@
      id: @VLAN@
      link: bond0
      nameservers:
        addresses: [@DNS@]
        search: [@SEARCH@]
      routes:
      - to: default
        via: @GATEWAY@
