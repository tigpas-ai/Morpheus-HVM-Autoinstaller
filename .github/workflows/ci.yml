name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/run.sh
      - name: Tests (without the original ISO)
        run: tests/run.sh
